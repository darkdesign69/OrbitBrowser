name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # If you uploaded OrbitBrowser.zip to the repo, unpack it and commit the files.
      # If the project files are already in the repo, this step does nothing.
      - name: Unpack project zip (only if present)
        run: |
          zip=$(ls OrbitBrowser*.zip 2>/dev/null | head -n1 || true)
          if [ -n "$zip" ]; then
            unzip -o -q "$zip"
            rm -f "$zip"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Unpack project files"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
