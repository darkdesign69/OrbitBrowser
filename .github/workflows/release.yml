name: Make Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, for example v1.0.0'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - run: gradle assembleDebug --no-daemon

      - name: Collect APK
        run: |
          set -e
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/OrbitBrowser-${{ inputs.tag }}.apk"
          ls -lh out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Orbit Browser ${{ inputs.tag }}
          body: |
            Orbit Browser ${{ inputs.tag }}
            Works on any Android 10+ phone.
          files: out/*.apk
          prerelease: ${{ inputs.prerelease }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
